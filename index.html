<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>신랑이름 ♥ 신부이름 결혼합니다</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:#f2f2f2;
    color:#333;
  }
  .frame{
    max-width:480px;
    margin:0 auto;
    background:#fff;
    min-height:100vh;
    padding:40px 24px;
    text-align:center;
  }
  h1{ font-size:20px; margin-bottom:8px; }
  .names{ font-size:22px; font-weight:bold; margin:16px 0; }
  .date{ font-size:15px; color:#666; margin-bottom:24px; }
  hr{ border:none; border-top:1px solid #eee; margin:24px 0; }
  section{ margin-bottom:28px; text-align:left; }
  h2{ font-size:14px; color:#999; margin-bottom:8px; }
  p{ font-size:15px; line-height:1.7; }
</style>
</head>
<body>
<div class="frame">
  <h1>모바일 청첩장</h1>
  <div class="names">신랑이름 ♥ 신부이름</div>
  <div class="date">2026년 00월 00일 (토) 오후 0시</div>
  <hr>

  <section>
    <h2>인사말</h2>
    <p>저희 두 사람이 새로운 시작을 함께합니다.<br>귀한 걸음 하시어 축복해 주시면 감사하겠습니다.</p>
  </section>

  <section>
    <h2>일시</h2>
    <p>2026년 00월 00일 토요일 오후 0시 00분</p>
  </section>

  <section>
    <h2>장소</h2>
    <p>OO웨딩홀 3층 그랜드홀<br>서울특별시 OO구 OO로 00</p>
  </section>

  <section>
    <h2>연락처 / 계좌번호</h2>
    <p>신랑측: 000-0000-0000 (OO은행)<br>신부측: 000-0000-0000 (OO은행)</p>
  </section>
</div>
</body>
</html>
